<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Safety Data Sheet (SDS)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
:root{
  --primary:#0d47a1;
  --accent:#e53935;
  --bg:#f4f7fc;
}

body{
  font-family:'Prompt',sans-serif;
  background:linear-gradient(135deg,#eef3ff,#f9fbff);
  margin:0;
  padding:30px 18px;
  color:#333;
}

.container{
  max-width:1200px;
  margin:auto;
}

header{
  text-align:center;
  margin-bottom:32px;
}

header h1{
  color:var(--primary);
  font-weight:600;
  margin-bottom:14px;
}

.search-box{
  max-width:420px;
  margin:auto;
}

.search-box input{
  width:90%;
  padding:12px 18px;
  border-radius:30px;
  border:1px solid #d0d6e2;
  font-size:15px;
  outline:none;
}

.search-box input:focus{
  border-color:var(--primary);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  margin-top:36px;
}

.card{
  background:#ffffff;
  border-radius:16px;
  padding:18px 22px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
  transition:all .35s ease;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 38px rgba(0,0,0,0.16);
}

.card a{
  text-decoration:none;
  display:flex;
  align-items:flex-start;
  gap:16px;
  color:var(--primary);
  line-height:1.55;
  font-weight:500;
}

.icon{
  font-size:28px;
  color:var(--accent);
  margin-top:4px;
}

footer{
  text-align:center;
  margin-top:50px;
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1><i class="fa-solid fa-folder-open"></i> Safety Data Sheet (SDS)</h1>
  <div class="search-box">
    <input type="text" id="search" placeholder="ค้นหา SDS / Safety Data Sheet...">
  </div>
</header>

<div class="grid" id="qpList">

<!-- Doc -->

  <div class="card"><a href="sample-pdf.pdf" target="_blank">
    <i class="fa-solid fa-file-pdf icon"></i>Sample-PDF (1)</a></div>

  <div class="card"><a href="sample-pdf.pdf" target="_blank">
    <i class="fa-solid fa-file-pdf icon"></i>Sample-PDF (2)</a></div>

  <div class="card"><a href="sample-pdf.pdf" target="_blank">
    <i class="fa-solid fa-file-pdf icon"></i>Sample-PDF (3)</a></div>

  <div class="card"><a href="sample-pdf.pdf" target="_blank">
    <i class="fa-solid fa-file-pdf icon"></i>Sample-PDF (4)</a></div>

</div>

<footer>VGD/S - Sustainable</footer>

</div>

<script>
document.getElementById("search").addEventListener("keyup", function () {
  const keyword = this.value.toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(keyword) ? "" : "none";
  });
});
</script>

</body>
</html>
