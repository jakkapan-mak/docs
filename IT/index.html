<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="utf-8">
<title>IT Documents</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
:root{
  --primary:#0d47a1;
  --accent:#e53935;
}

body{
  font-family:'Prompt',sans-serif;
  background:linear-gradient(135deg,#eef3ff,#f9fbff);
  margin:0;
  padding:30px 18px;
}

.home-btn{
  position:absolute;
  top:20px;
  left:20px;
  background:#fff;
  color:#0d47a1;
  padding:10px 16px;
  border-radius:999px;
  text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.container{
  max-width:1200px;
  margin:auto;
}

header{
  text-align:center;
  margin-bottom:30px;
}

header h1{
  color:var(--primary);
}

.search-box input{
  width:90%;
  max-width:400px;
  padding:12px;
  border-radius:30px;
  border:1px solid #ccc;
}

/* ✅ WI STYLE */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  margin-top:25px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 38px rgba(0,0,0,0.15);
}

.card a{
  text-decoration:none;
  display:flex;
  gap:14px;
  color:var(--primary);
  font-weight:500;
}

.icon{
  font-size:24px;
  color:var(--accent);
}

.count{
  text-align:center;
  margin-top:10px;
  color:#666;
}

footer{
  text-align:center;
  margin-top:40px;
  color:#777;
}
</style>
</head>

<body>

<a href="https://jakkapan-mak.github.io/docs/" class="home-btn">
  <i class="fa-solid fa-house"></i> Home
</a>

<div class="container">

<header>
<h1><i class="fa-solid fa-server"></i> IT Documents</h1>

<div class="search-box">
<input type="text" id="search" placeholder="🔍 ค้นหาไฟล์...">
</div>

<div class="count" id="fileCount">⏳ กำลังโหลด...</div>
</header>

<div class="grid" id="qpList"></div>

<footer>IT System - Document Center</footer>

</div>

<script>
const repo = "jakkapan-mak/docs";
const folder = "IT";

const container = document.getElementById("qpList");
const countBox = document.getElementById("fileCount");

// ✅ ไอคอน
function getIcon(name){
  name = name.toLowerCase();
  if(name.endsWith(".pdf")) return "fa-file-pdf";
  if(name.match(/\.(xls|xlsx)$/)) return "fa-file-excel";
  if(name.match(/\.(doc|docx)$/)) return "fa-file-word";
  if(name.match(/\.(ppt|pptx)$/)) return "fa-file-powerpoint";
  if(name.match(/\.(jpg|png|jpeg)$/)) return "fa-file-image";
  return "fa-file";
}

// ✅ โหลดไฟล์
fetch(`https://api.github.com/repos/${repo}/contents/${folder}`)
.then(res=>res.json())
.then(data=>{

  let count = 0;

  data.forEach(file=>{

    if(file.type !== "file" || file.name === "index.html") return;

    count++;

    // ✅ 🔥 จุดสำคัญ (แก้ปัญหาคุณ)
    const fileURL = `https://jakkapan-mak.github.io/docs/IT/${encodeURIComponent(file.name)}`;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <a href="${fileURL}" target="_con"></i>
        ${file.name.replace(/\.[^/.]+$/, "")}
      </a>
    `;

    container.appendChild(card);
  });

  countBox.innerText = "📄 จำนวนทั้งหมด: " + count + " รายการ";

});

// ✅ search
document.getElementById("search").addEventListener("keyup", function () {
  const keyword = this.value.toLowerCase();

  let visible = 0;

  document.querySelectorAll(".card").forEach(card => {
    const show = card.innerText.toLowerCase().includes(keyword);
    card.style.display = show ? "" : "none";
    if(show) visible++;
  });

  document.getElementById("fileCount").innerText =
    keyword ? "🔍 พบ " + visible + " รายการ"
            : "📄 จำนวนทั้งหมด: " + visible + " รายการ";
});
</script>

</body>
</html>
