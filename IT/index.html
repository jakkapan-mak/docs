<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="utf-8">
<title>IT Documents</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- ✅ Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --primary:#0d47a1;
  --accent:#e53935;
}

body{
  font-family:'Prompt',sans-serif;
  background:linear-gradient(135deg,#eef3ff,#f9fbff);
  margin:0;
  padding:30px 18px;
}

.container{
  max-width:1200px;
  margin:auto;
}
.home-btn{
  position:absolute;
  top:20px;
  left:20px;
  background:#fff;
  color:#0d47a1;
  padding:10px 16px;
  border-radius:999px;
  text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

header{
  text-align:center;
  margin-bottom:30px;
}

header h1{
  color:var(--primary);
}

.search-box input{
  width:90%;
  max-width:400px;
  padding:12px;
  border-radius:30px;
  border:1px solid #ccc;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  margin-top:25px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
}

.card a{
  text-decoration:none;
  display:flex;
  gap:14px;
  align-items:center;
  color:var(--primary);
  font-weight:500;
}

.icon{
  font-size:26px;
}

.count{
  text-align:center;
  margin-top:10px;
  color:#666;
}
</style>
</head>

<body>
    
<a href="https://jakkapan-mak.github.io/docs/" class="home-btn">
  <i class="fa-solid fa-house"></i> Home
</a>

<div class="container">

<header>
<h1><i class="fa-solid fa-server"></i> IT Documents</h1>

<div class="search-box">
<input type="text" id="search" placeholder="🔍 ค้นหาไฟล์...">
</div>

<div class="count" id="fileCount">⏳ กำลังโหลด...</div>
</header>

<div class="grid" id="qpList"></div>

</div>

<script>
const repo = "jakkapan-mak/docs";
const folder = "IT";

const container = document.getElementById("qpList");
const countBox = document.getElementById("fileCount");

// ✅ icon + สี
function getIcon(name){
  name = name.toLowerCase();

  if(name.endsWith(".pdf"))
    return {icon:"fa-file-pdf", color:"#e53935"};

  if(name.match(/\.(xls|xlsx)$/))
    return {icon:"fa-file-excel", color:"#43a047"};

  if(name.match(/\.(doc|docx)$/))
    return {icon:"fa-file-word", color:"#1e88e5"};

  if(name.match(/\.(ppt|pptx)$/))
    return {icon:"fa-file-powerpoint", color:"#fb8c00"};

  if(name.match(/\.(jpg|png|jpeg)$/))
    return {icon:"fa-file-image", color:"#00acc1"};

  return {icon:"fa-file", color:"#607d8b"};
}


// ✅ โหลดไฟล์
fetch(`https://api.github.com/repos/${repo}/contents/${folder}`)
.then(res => res.json())
.then(data => {

  let count = 0;

  data.forEach(file => {

    if(file.type !== "file" || file.name === "index.html") return;

    count++;

    const fileURL = `https://jakkapan-mak.github.io/docs/IT/${encodeURIComponent(file.name)}`;

    const info = getIcon(file.name);

    const card = document.createElement("div");
    card.className = "card";

    // ✅ ✅ ✅ จุดที่แก้แล้ว
    card.innerHTML = `
      <a href="${fileURL}" target="_blanklor:${info.color}"></i>
        ${file.name.replace(/\.[^/.]+$/, "")}
      </a>
    `;

    container.appendChild(card);
  });

  countBox.innerText = "📄 จำนวนทั้งหมด: " + count + " รายการ";
});


// ✅ search
document.getElementById("search").addEventListener("keyup", function () {
  const keyword = this.value.toLowerCase();

  let visible = 0;

  document.querySelectorAll(".card").forEach(card => {
    const show = card.innerText.toLowerCase().includes(keyword);
    card.style.display = show ? "" : "none";
    if(show) visible++;
  });

  document.getElementById("fileCount").innerText =
    keyword ? "🔍 พบ " + visible + " รายการ"
            : "📄 จำนวนทั้งหมด: " + visible + " รายการ";
});
</script>

</body>
</html>
