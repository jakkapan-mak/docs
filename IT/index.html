<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="utf-8">
<title>IT Documents</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font -->
https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body{
  font-family:'Prompt',sans-serif;
  background:linear-gradient(135deg,#eef3ff,#f9fbff);
  margin:0;
  padding:30px;
}

.container{
  max-width:1100px;
  margin:auto;
}

h1{
  text-align:center;
  color:#0d47a1;
}

.search-box input{
  width:100%;
  max-width:400px;
  display:block;
  margin:15px auto;
  padding:10px;
  border-radius:30px;
  border:1px solid #ccc;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  padding:16px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.card a{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#0d47a1;
}

.icon{
  font-size:24px;
}

.count{
  text-align:center;
  margin:10px;
}
</style>
</head>

<body>

<div class="container">

<h1><i class="fa-solid fa-server"></i> IT Documents</h1>

<div class="search-box">
<input type="text" id="search" placeholder="🔍 ค้นหาไฟล์...">
</div>

<div id="fileCount" class="count">⏳ กำลังโหลด...</div>

<div id="qpList" class="grid"></div>

</div>

<script>
const repo = "jakkapan-mak/docs";
const folder = "IT";

// ✅ บังคับ branch
const branch = "main"; // ถ้าไม่ขึ้น เปลี่ยนเป็น "master"

const list = document.getElementById("qpList");
const countBox = document.getElementById("fileCount");

// ✅ icon function
function getIcon(name){
  name = name.toLowerCase();

  if(name.endsWith(".pdf")) return ["fa-file-pdf","#e53935"];
  if(name.match(/\.(xls|xlsx)$/)) return ["fa-file-excel","#43a047"];
  if(name.match(/\.(doc|docx)$/)) return ["fa-file-word","#1e88e5"];
  if(name.match(/\.(ppt|pptx)$/)) return ["fa-file-powerpoint","#fb8c00"];
  if(name.match(/\.(jpg|png|jpeg)$/)) return ["fa-file-image","#00acc1"];

  return ["fa-file","#607d8b"];
}

// ✅ โหลดไฟล์
fetch(`https://api.github.com/repos/${repo}/contents/${folder}?ref=${branch}`)
.then(res => {
  if(!res.ok) throw new Error("API error");
  return res.json();
})
.then(data => {

  if(!Array.isArray(data)) throw new Error("no data");

  let count = 0;

  data.forEach(file => {

    if(file.type !== "file") return;

    count++;

    const [icon,color] = getIcon(file.name);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      ${file.download_url}
        <i class="fa-solid ${icon} icon" style="color:${color}"></i>
        ${file.name.replace(/\.[^/.]+$/, "")}
      </a>
    `;

    list.appendChild(card);
  });

  countBox.innerText = `📄 จำนวนทั้งหมด: ${count} รายการ`;

})
.catch(err => {
  console.error(err);

  // ✅ fallback แจ้งแบบชัด
  countBox.innerHTML = `
    ❌ โหลดไฟล์ไม่สำเร็จ<br>
    <small>เช็ค:
    <br>1. repo = ${repo}
    <br>2. folder = ${folder}
    <br>3. branch = ${branch}
    </small>
  `;
});

// ✅ search
document.getElementById("search").addEventListener("keyup", function () {
  const keyword = this.value.toLowerCase();
  let visible = 0;

  document.querySelectorAll(".card").forEach(card => {
    const show = card.innerText.toLowerCase().includes(keyword);
    card.style.display = show ? "" : "none";
    if(show) visible++;
  });

  document.getElementById("fileCount").innerText =
    keyword ? `🔍 พบ ${visible} รายการ`
            : `📄 จำนวนทั้งหมด: ${visible} รายการ`;
});
</script>

</body>
</html>
